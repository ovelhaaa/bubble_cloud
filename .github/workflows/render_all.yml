name: Render All Presets

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Input WAV file path'
        required: true
        default: 'tests/fixtures/audio/test_in.wav'
        type: choice
        options:
          - 'tests/fixtures/audio/test_in.wav'
          - 'tests/fixtures/audio/test_in_short.wav'
          - 'tests/fixtures/audio/groove_7.wav'
          - 'tests/fixtures/audio/liecio-guitar-chord-sequence-to-make-a-beat-258061.wav'
          - 'tests/fixtures/audio/farran_ez-soft-indie-guitar-sample-456142.wav'
          - 'tests/fixtures/audio/freesound_community-electric-guitar-phrase-38142.wav'
          - 'tests/fixtures/audio/freesound_community-guitar-103460.wav'
          - 'tests/fixtures/audio/freesound_community-spanish-guitar-loop-17221.wav'
          - 'tests/fixtures/audio/ncone-bgm-blues-guitar-loop-192099.wav'
          - 'tests/fixtures/audio/u_1aiqn32afi-clean-country-lick-bend-289052.wav'
  push:
    paths:
      - 'core/engine/bubble_engine.c'
      - 'core/engine/bubble_engine.h'
      - 'core/dsp/sound_bubbles_dsp.c'
      - 'core/dsp/sound_bubbles_dsp.h'
      - 'core/sound_bubbles_dsp.h'
      - 'platform/offline/sound_bubbles_render.c'
      - 'core/presets/factory/*.json'
      - 'tests/fixtures/audio/*.wav'
      - '.github/workflows/render_all.yml'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Input Path
        run: |
          INPUT_FILE="${{ github.event.inputs.input_file }}"

          if [ -z "$INPUT_FILE" ]; then
            INPUT_FILE="tests/fixtures/audio/test_in.wav"
          fi

          INPUT_BASE="$(basename "$INPUT_FILE" .wav)"

          echo "input_file=$INPUT_FILE" >> "$GITHUB_ENV"
          echo "INPUT_BASE=$INPUT_BASE" >> "$GITHUB_ENV"

      - name: Debug Input Path
        run: |
          echo "input_file=$input_file"
          echo "INPUT_BASE=$INPUT_BASE"
          file "$input_file"
          sha256sum "$input_file"

      - name: Verify Required Files
        run: |
          echo "Checking renderer sources..."
          ls -l platform/offline/sound_bubbles_render.c core/engine/bubble_engine.c core/engine/bubble_engine.h core/dsp/sound_bubbles_dsp.c core/dsp/sound_bubbles_dsp.h core/sound_bubbles_dsp.h

          echo "Checking input file: $input_file"
          if [ ! -f "$input_file" ]; then
            echo "Error: Input file '$input_file' not found!"
            exit 1
          fi

          echo "Checking presets directory..."
          if [ ! -d core/presets/factory ]; then
            echo "Error: core/presets/factory directory not found!"
            exit 1
          fi

          PRESET_COUNT=$(find core/presets/factory -maxdepth 1 -name '*.json' | wc -l)
          if [ "$PRESET_COUNT" -eq 0 ]; then
            echo "Error: No preset JSON files found in core/presets/factory/!"
            exit 1
          fi

          echo "Found $PRESET_COUNT preset(s):"
          ls -lh core/presets/factory/*.json
          echo "Sample files:"
          ls -lh tests/fixtures/audio || true

      - name: Compile Offline Renderer
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          gcc platform/offline/sound_bubbles_render.c core/engine/bubble_engine.c core/dsp/sound_bubbles_dsp.c core/presets/bubble_preset.c -O2 -Wall -Wextra -std=c11 -lm -Icore -Icore/dsp -o "$RUNNER_TEMP/bin/sound_bubbles_render"

      - name: Render All Presets
        run: |
          RENDER_DIR="$RUNNER_TEMP/renders"
          rm -rf "$RENDER_DIR"
          mkdir -p "$RENDER_DIR"
          echo "RENDER_DIR=$RENDER_DIR" >> "$GITHUB_ENV"

          echo "Selected input file: $input_file"
          echo "Input basename: $INPUT_BASE"

          for preset in core/presets/factory/*.json; do
            [ -f "$preset" ] || continue

            PRESET_BASE="$(basename "$preset" .json)"
            OUTPUT_FILE="$RENDER_DIR/${INPUT_BASE}__${PRESET_BASE}.wav"

            echo "Rendering:"
            echo "  input  = $input_file"
            echo "  preset = $preset"
            echo "  output = $OUTPUT_FILE"

            "$RUNNER_TEMP/bin/sound_bubbles_render" "$input_file" "$preset" "$OUTPUT_FILE"

            if [ ! -f "$OUTPUT_FILE" ]; then
              echo "Error: Failed to generate '$OUTPUT_FILE'"
              exit 1
            fi
          done

      - name: Verify Outputs
        run: |
          OUTPUT_COUNT=$(find "$RENDER_DIR" -maxdepth 1 -name '*.wav' | wc -l)
          if [ "$OUTPUT_COUNT" -eq 0 ]; then
            echo "Error: No WAV outputs were generated!"
            exit 1
          fi

          echo "Generated $OUTPUT_COUNT WAV file(s):"
          ls -lh "$RENDER_DIR"/*.wav

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ env.INPUT_BASE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/renders/*.wav
