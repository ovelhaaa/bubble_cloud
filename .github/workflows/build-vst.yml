name: Build JUCE Plugins (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'platform/juce/**'
      - 'core/**'
      - '.github/workflows/build-vst.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows VST3 & Standalone
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          mkdir build_juce
          cd build_juce
          cmake ../platform/juce -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugins
        run: |
          cd build_juce
          cmake --build . --config Release --parallel 4

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleCloud-Windows-VST3
          path: build_juce/BubbleCloud_artefacts/Release/VST3/Bubble Cloud.vst3/

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleCloud-Windows-Standalone
          path: build_juce/BubbleCloud_artefacts/Release/Standalone/Bubble Cloud.exe
