name: Tests

on:
  pull_request:
    paths:
      - 'core/**'
      - 'platform/**'
      - 'tests/**'
      - 'ui/web/**'
      - 'scripts/**'
      - 'docs/macro_matrix.yaml'
      - 'Makefile'
      - '.github/workflows/tests.yml'
  push:
    paths:
      - 'core/**'
      - 'platform/**'
      - 'tests/**'
      - 'ui/web/**'
      - 'scripts/**'
      - 'docs/macro_matrix.yaml'
      - 'Makefile'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core DSP and static guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Show tool versions
        run: |
          gcc --version
          python --version

      - name: Run core, preset, performance, and static tests
        run: python -m pytest -q tests --ignore=tests/dsp/test_offline_wasm_parity.py

      - name: Validate M4C Float and Int16 Storage Backends
        run: |
          gcc -O2 -Wall -Wextra -std=c11 -DBUBBLES_RING_FLOAT=1 -Icore -Icore/dsp -Icore/engine scripts/m4c_1_freeze_probe.c core/engine/bubble_engine.c core/engine/bubble_macro_map.c -lm -o /tmp/probe_float
          gcc -O2 -Wall -Wextra -std=c11 -DBUBBLES_RING_FLOAT=0 -Icore -Icore/dsp -Icore/engine scripts/m4c_1_freeze_probe.c core/engine/bubble_engine.c core/engine/bubble_macro_map.c -lm -o /tmp/probe_int16
          /tmp/probe_float --determinism
          /tmp/probe_int16 --determinism --dither
          /tmp/probe_float --freeze-lock
          /tmp/probe_int16 --freeze-lock --dither
          /tmp/probe_int16 --dither-isolation
          /tmp/probe_float --block-invariance
          /tmp/probe_int16 --block-invariance --dither

  wasm-parity:
    name: Offline C and WASM parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Show tool versions
        run: |
          gcc --version
          python --version
          node --version
          emcc --version

      - name: Build WASM test module
        run: make -B wasm

      - name: Run parity test
        run: python -m pytest -q tests/dsp/test_offline_wasm_parity.py
