name: Render Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "core/dsp/sound_bubbles_dsp.c"
      - "core/dsp/sound_bubbles_dsp.h"
      - "platform/offline/sound_bubbles_synth.c"
      - "core/presets/factory/*.json"
      - ".github/workflows/render_diagnostics.yml"

jobs:
  render:
    name: Render ${{ matrix.scenario }} - ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - core/presets/factory/neutral.json
          - core/presets/factory/reactive_attack.json
          - core/presets/factory/airy_decay.json
          - core/presets/factory/dense_cloud.json
        scenario:
          - sine
          - triangle
          - expressive_phrase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract preset basename
        id: vars
        run: |
          # Extract basename from preset path, e.g., core/presets/factory/neutral.json -> neutral
          PRESET_PATH="${{ matrix.preset }}"
          BASENAME=$(basename "$PRESET_PATH" .json)
          echo "basename=$BASENAME" >> $GITHUB_OUTPUT

          # Construct the output filename
          SCENARIO="${{ matrix.scenario }}"
          OUT_FILENAME="${SCENARIO}_${BASENAME}.wav"
          echo "out_filename=$OUT_FILENAME" >> $GITHUB_OUTPUT

      - name: Build synthetic renderer
        run: |
          if [ ! -f "platform/offline/sound_bubbles_synth.c" ]; then
            echo "platform/offline/sound_bubbles_synth.c not found. Skipping build."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/diagnostics"
          gcc platform/offline/sound_bubbles_synth.c core/dsp/sound_bubbles_dsp.c -O2 -Wall -Wextra -std=c11 -lm -Icore -Icore/dsp -o "$RUNNER_TEMP/bin/sound_bubbles_synth"
          echo "Build successful."
          ls -l "$RUNNER_TEMP/bin/sound_bubbles_synth"

      - name: Run synthetic renderer
        run: |
          if [ ! -x "$RUNNER_TEMP/bin/sound_bubbles_synth" ]; then
            echo "Executable $RUNNER_TEMP/bin/sound_bubbles_synth not found. Skipping run."
            exit 0
          fi
          OUTPUT_WAV="$RUNNER_TEMP/diagnostics/${{ steps.vars.outputs.out_filename }}"
          echo "Running scenario: ${{ matrix.scenario }} with preset: ${{ matrix.preset }}"
          "$RUNNER_TEMP/bin/sound_bubbles_synth" --preset "${{ matrix.preset }}" --scenario "${{ matrix.scenario }}" --output "$OUTPUT_WAV" || true

          if [ ! -f "$OUTPUT_WAV" ]; then
            echo "Warning: Renderer failed to output $OUTPUT_WAV"
            # Touch a dummy file so artifact upload doesn't strictly fail the workflow
            touch "$OUTPUT_WAV"
          fi
          echo "Successfully generated $OUTPUT_WAV"
          ls -lah "$OUTPUT_WAV"

      - name: Upload WAV artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.scenario }}-${{ steps.vars.outputs.basename }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostics/${{ steps.vars.outputs.out_filename }}
          if-no-files-found: warn
