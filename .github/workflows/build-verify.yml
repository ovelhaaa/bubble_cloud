name: Build Verify

on:
  pull_request:
    paths:
      - 'core/**'
      - 'ui/web/**'
      - 'platform/wasm/**'
      - 'platform/offline/**'
      - 'Makefile'
      - '.github/workflows/build-verify.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'ui/web/**'
      - 'platform/wasm/**'
      - 'platform/offline/**'
      - 'Makefile'
      - '.github/workflows/build-verify.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: Build wasm target
        run: make -B wasm WASM_OUT="$RUNNER_TEMP/build/bubble_cloud_wasm.js"

      - name: Verify wasm outputs
        run: |
          test -f "$RUNNER_TEMP/build/bubble_cloud_wasm.js"

      - name: Build offline target
        run: make -B offline OFFLINE_RENDERER="$RUNNER_TEMP/build/sound_bubbles_render"
